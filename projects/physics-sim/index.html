<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation | Nicholas Laureano</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Nicholas Laureano</h1>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="../index.html">Projects</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="canvas-wrapper">
                <canvas id="simCanvas" width="800" height="600"></canvas>
            </div>
            <div class="control-panel">
                <div class="control-group">
                    <h3>Simulation Info</h3>
                    <p>Particles: <span id="particleCounter">0</span></p>
                    <p>Speed: <span id="speedValue">1.0</span>x</p>
                    <div class="speed-buttons">
                        <button class="speed-btn" data-speed="0">0x</button>
                        <button class="speed-btn" data-speed="0.1">0.1x</button>
                        <button class="speed-btn" data-speed="0.5">0.5x</button>
                        <button class="speed-btn active" data-speed="1">1x</button>
                        <button class="speed-btn" data-speed="2">2x</button>
                        <button class="speed-btn" data-speed="3">3x</button>
                        <button class="speed-btn" data-speed="5">5x</button>
                    </div>
                    <button id="resetButton" class="reset-btn" title="Reset Simulation">↻</button>
                </div>
                <div class="control-group">
                    <h3>Particle Settings</h3>
                    <div class="input-control">
                        <label>Mass:</label>
                        <div class="input-group">
                            <button class="input-btn minus" data-target="massInput">−</button>
                            <input type="number" id="massInput" value="1" min="1" step="1">
                            <button class="input-btn plus" data-target="massInput">+</button>
                        </div>
                    </div>
                    <div class="input-control">
                        <label>Radius:</label>
                        <div class="input-group">
                            <button class="input-btn minus" data-target="radiusInput">−</button>
                            <input type="number" id="radiusInput" value="8" min="1" step="1">
                            <button class="input-btn plus" data-target="radiusInput">+</button>
                        </div>
                    </div>
                    <div class="input-control">
                        <label>Velocity X:</label>
                        <div class="input-group">
                            <button class="input-btn minus" data-target="velocityXInput">−</button>
                            <input type="number" id="velocityXInput" value="0" step="100">
                            <button class="input-btn plus" data-target="velocityXInput">+</button>
                        </div>
                    </div>
                    <div class="input-control">
                        <label>Velocity Y:</label>
                        <div class="input-group">
                            <button class="input-btn minus" data-target="velocityYInput">−</button>
                            <input type="number" id="velocityYInput" value="0" step="100">
                            <button class="input-btn plus" data-target="velocityYInput">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Nicholas Laureano</p>
    </footer>

    <script src="script.js"></script>
    <script src="../../js/global.js"></script>
</body>
</html>
